name: mcp-ozon-position

# Explicit opt-in overlay for marketplace snapshot collection. The base stack
# remains disabled. Operators must supply all three existing host paths and
# activate the reporting-live profile deliberately.
services:
  report-collector:
    profiles:
      - reporting-live
    command:
      - run-scheduler
    environment:
      REPORT_COLLECTOR_MODE: scheduled
      # The container receives one collection policy; mail routing stays with
      # report-worker. The legacy host variable remains supported.
      DAILY_REPORT_POLICY: ""
      REPORT_COLLECTION_POLICY: /etc/mcp-ozon/daily-report-policy.json
      REPORT_COLLECTOR_CREDENTIAL_DIR: /run/mcp-ozon/report-credentials
    volumes:
      - type: bind
        source: ${MCP_ACCESS_CONFIG_HOST:?MCP_ACCESS_CONFIG_HOST is required for live reporting}
        target: /etc/mcp-ozon/access.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${REPORT_COLLECTION_POLICY_HOST:-${DAILY_REPORT_POLICY_HOST:?REPORT_COLLECTION_POLICY_HOST or DAILY_REPORT_POLICY_HOST is required for live reporting}}
        target: /etc/mcp-ozon/daily-report-policy.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${REPORT_COLLECTOR_CREDENTIAL_DIR_HOST:?REPORT_COLLECTOR_CREDENTIAL_DIR_HOST is required for live reporting}
        target: /run/mcp-ozon/report-credentials
        read_only: true
        bind:
          create_host_path: false
