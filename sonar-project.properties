sonar.projectKey=mcp-ozon
sonar.projectName=MCP Ozon
sonar.projectVersion=0.2.1
sonar.projectDescription=Marketplace MCP servers, reporting pipeline and guarded advertising control for Ozon and Wildberries
sonar.sourceEncoding=UTF-8

# The whole tracked repository is analysed: Rust, Python, shell, SQL,
# Dockerfiles, Compose, workflows and runtime configuration.
# scripts/sonar-scan.sh copies only git-tracked files into the scanner, so
# local secrets (.env, report-credentials/, ...) are never indexed.
sonar.sources=.
sonar.tests=tests,src,scripts
# Rust test modules that live next to production code are test code. Counting
# them as sources would inflate both size and coverage.
# Test harnesses outside tests/ are test code as well: shell suites that CI
# runs (they carry fixture credentials such as verify-only-*-not-a-secret),
# the CI MCP session smoke client and the sterile recovery drill.
sonar.test.inclusions=tests/**,src/**/tests/**,src/**/tests.rs,src/**/*_tests.rs,src/test_support.rs,src/test_support/**,scripts/test-*.sh,scripts/verify-compose-hardening.sh,scripts/mcp-session-load-smoke.py,scripts/runtime-recovery-drill.py
sonar.exclusions=tests/**,src/**/tests/**,src/**/tests.rs,src/**/*_tests.rs,src/test_support.rs,src/test_support/**,scripts/test-*.sh,scripts/verify-compose-hardening.sh,scripts/mcp-session-load-smoke.py,scripts/runtime-recovery-drill.py,vendor/**,reports/**,target/**,.git/**,.scannerwork/**
# .github (workflows, dependabot) and dotfiles such as .dockerignore are tracked
# configuration; index them so imported zizmor findings attach to their lines.
sonar.scanner.excludeHiddenFiles=false
# Upstream rmcp is tracked by vendor/rmcp/UPSTREAM.md and the CI checksum
# check; its local patch is reviewed there rather than scored here.

sonar.rust.cargo.manifestPaths=Cargo.toml,crates/mcp-storage/Cargo.toml,crates/mcp-marketplace-types/Cargo.toml
# Clippy is executed with the repository's exact locked toolchain before scan.
# Import that report instead of running a second unpinned Clippy inside the
# minimal scanner container, which intentionally contains no Rust toolchain.
sonar.rust.clippy.enabled=false
sonar.rust.clippyReport.reportPaths=reports/clippy.json
# No coverage exclusions: runtime entrypoints are measured like library code.
sonar.rust.lcov.reportPaths=reports/lcov.info
sonar.testExecutionReportPaths=reports/test-executions.xml

sonar.python.version=3.12,3.13,3.14
sonar.python.coverage.reportPaths=reports/python-coverage.xml

# Every shipped image, not only the file literally named Dockerfile.
sonar.docker.file.patterns=Dockerfile,Dockerfile.*,*.dockerfile
# Community Build has no shell, SQL or GitHub Actions analyzer. Index those
# files for secret detection and import ShellCheck and zizmor results.
sonar.text.inclusions=**/*.sh,**/*.bash,**/*.zsh,**/*.ksh,**/*.ps1,**/*.properties,**/*.conf,**/*.pem,**/*.config,**/*.env,.aws/config,**/*.key,**/*.sql,**/*.template,**/*.plist.in
sonar.externalIssuesReportPaths=reports/shellcheck-issues.json
sonar.sarifReportPaths=reports/zizmor.sarif

# Base images are pinned as tag@sha256 on purpose: the digest is immutable and
# the tag keeps reviews readable. Dependabot updates both parts together.
sonar.issue.ignore.multicriteria=pinnedTagAndDigest,asciiDigits,privateRanges,loopbackUrl
sonar.issue.ignore.multicriteria.pinnedTagAndDigest.ruleKey=docker:S8431
sonar.issue.ignore.multicriteria.pinnedTagAndDigest.resourceKey=**/Dockerfile*
# Validation of interface names, ports and exit codes uses [0-9] on purpose:
# Python's \d also accepts non-ASCII digits.
sonar.issue.ignore.multicriteria.asciiDigits.ruleKey=python:S6353
sonar.issue.ignore.multicriteria.asciiDigits.resourceKey=scripts/**/*.py
# The route helper requires the gateway to lie in an RFC 1918 private range.
sonar.issue.ignore.multicriteria.privateRanges.ruleKey=python:S1313
sonar.issue.ignore.multicriteria.privateRanges.resourceKey=scripts/marketplace_routes.py
# The heartbeat requires the tunnel health URL to be a plain-HTTP 127.0.0.1 endpoint.
sonar.issue.ignore.multicriteria.loopbackUrl.ruleKey=python:S5332
sonar.issue.ignore.multicriteria.loopbackUrl.resourceKey=scripts/operations_heartbeat.py

sonar.working.directory=.scannerwork
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
sonar.scm.disabled=true
