sonar.projectKey=mcp-ozon
sonar.projectName=MCP Ozon
sonar.projectVersion=0.2.0
sonar.projectDescription=Read-only MCP server for Ozon Seller analytics
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests
sonar.coverage.exclusions=src/main.rs
sonar.rust.cargo.manifestPaths=Cargo.toml
sonar.rust.clippy.enabled=false
sonar.rust.clippyReport.reportPaths=target/sonar/clippy.json
sonar.rust.lcov.reportPaths=target/sonar/lcov.info
sonar.testExecutionReportPaths=target/sonar/test-executions.xml

sonar.working.directory=.scannerwork
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
sonar.scm.provider=git
