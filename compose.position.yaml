name: mcp-ozon-position

services:
  position-db:
    image: ${MCP_POSITION_DB_IMAGE:-mcp-ozon-position-db:local}
    build:
      context: ./position-monitor
      dockerfile: Dockerfile
      args:
        MCP_RELEASE_GIT_SHA: ${MCP_RELEASE_GIT_SHA:-unverified}
    environment:
      POSTGRES_DB: ${POSITION_DB_NAME:-ozon_positions}
      POSTGRES_USER: ${POSITION_DB_ADMIN_USER:-position_admin}
      POSTGRES_PASSWORD: ${POSITION_DB_ADMIN_PASSWORD:?POSITION_DB_ADMIN_PASSWORD is required}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256 --auth-local=scram-sha-256
      POSITION_COLLECTOR_DB_PASSWORD: ${POSITION_COLLECTOR_DB_PASSWORD:?POSITION_COLLECTOR_DB_PASSWORD is required}
      POSITION_READER_DB_PASSWORD: ${POSITION_READER_DB_PASSWORD:?POSITION_READER_DB_PASSWORD is required}
      REPORT_WORKER_DB_PASSWORD: ${REPORT_WORKER_DB_PASSWORD:?REPORT_WORKER_DB_PASSWORD is required}
      REPORT_COLLECTOR_DB_PASSWORD: ${REPORT_COLLECTOR_DB_PASSWORD:?REPORT_COLLECTOR_DB_PASSWORD is required}
      REPORT_REFRESH_REQUESTER_DB_PASSWORD: ${REPORT_REFRESH_REQUESTER_DB_PASSWORD:?REPORT_REFRESH_REQUESTER_DB_PASSWORD is required}
      CONTROL_WRITER_DB_PASSWORD: ${CONTROL_WRITER_DB_PASSWORD:?CONTROL_WRITER_DB_PASSWORD is required}
      OZON_CONTROL_PLANNER_DB_PASSWORD: ${OZON_CONTROL_PLANNER_DB_PASSWORD:?OZON_CONTROL_PLANNER_DB_PASSWORD is required}
      OZON_CONTROL_EXECUTOR_DB_PASSWORD: ${OZON_CONTROL_EXECUTOR_DB_PASSWORD:?OZON_CONTROL_EXECUTOR_DB_PASSWORD is required}
      WB_AUTOMATION_DB_PASSWORD: ${WB_AUTOMATION_DB_PASSWORD:?WB_AUTOMATION_DB_PASSWORD is required}
    volumes:
      - position-data:/var/lib/postgresql/data
    networks:
      - position-internal
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    shm_size: 64m
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=32m,mode=1777
      # PostgreSQL runs as the image's unprivileged postgres user (70:70), so
      # its socket directory must be owned by that user on Docker Desktop too.
      - /var/run/postgresql:size=8m,mode=3775,uid=70,gid=70
    healthcheck:
      test: ["CMD", "/usr/local/bin/position-db-healthcheck"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  position-collector:
    image: ${MCP_POSITION_COLLECTOR_IMAGE:-mcp-ozon-position-collector:local}
    build:
      context: .
      dockerfile: Dockerfile.position-collector
      args:
        MCP_RELEASE_GIT_SHA: ${MCP_RELEASE_GIT_SHA:-unverified}
    environment:
      POSITION_COLLECTOR_MODE: disabled
      POSITION_COLLECTOR_DATABASE_URL: postgresql://position_collector:${POSITION_COLLECTOR_DB_PASSWORD:?POSITION_COLLECTOR_DB_PASSWORD is required}@position-db:5432/${POSITION_DB_NAME:-ozon_positions}
      RUST_LOG: mcp_ozon::position_collector=info
    depends_on:
      position-db:
        condition: service_healthy
    networks:
      - position-internal
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/position-collector", "healthcheck"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 10s

  # Shared credentialless API egress proxy. Its in-image Squid policy permits
  # CONNECT tunnels solely to the exact Ozon Seller/Performance and WB
  # Analytics/Prices/Promotion hosts. Reporting credentials remain in
  # report-collector and WB write credentials remain in Control; the proxy
  # receives neither and cannot select any additional destination.
  ozon-egress:
    image: ${MCP_OZON_EGRESS_IMAGE:-mcp-ozon-egress:local}
    build:
      context: .
      dockerfile: Dockerfile.ozon-egress
      args:
        MCP_RELEASE_GIT_SHA: ${MCP_RELEASE_GIT_SHA:-unverified}
    depends_on:
      position-db:
        condition: service_healthy
    networks:
      - ozon-egress-internal
      - outbound
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/squid:size=8m,mode=1777
      - /var/log/squid:size=4m,mode=1777
      - /var/run/squid:size=1m,mode=1777
    # A live PID proved only that a process existed. This asks the proxy for a
    # destination outside its allowlist and requires the refusal: the port is
    # serving, the configuration parsed, and deny-by-default is in force. It
    # needs no external connectivity, so the check cannot pass by reaching the
    # internet — and it fails loudly if the allowlist is ever opened up.
    healthcheck:
      test:
        - CMD-SHELL
        - "printf 'GET http://healthcheck.invalid/ HTTP/1.0\r\n\r\n' | nc -w 3 127.0.0.1 3128 | head -1 | grep -q '403 Forbidden'"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 10s

  report-collector:
    image: ${MCP_REPORT_COLLECTOR_IMAGE:-mcp-ozon-report-collector:local}
    build:
      context: .
      dockerfile: Dockerfile.report-collector
      args:
        MCP_RELEASE_GIT_SHA: ${MCP_RELEASE_GIT_SHA:-unverified}
    environment:
      REPORT_COLLECTOR_MODE: disabled
      REPORT_COLLECTOR_DATABASE_URL: postgresql://report_collector:${REPORT_COLLECTOR_DB_PASSWORD:?REPORT_COLLECTOR_DB_PASSWORD is required}@position-db:5432/${POSITION_DB_NAME:-ozon_positions}
      MCP_ACCESS_CONFIG: /etc/mcp-ozon/access.json
      DAILY_REPORT_POLICY: /etc/mcp-ozon/daily-report-policy.json
      RUST_LOG: mcp_ozon::reporting=info
    volumes:
      - type: bind
        source: ${MCP_ACCESS_CONFIG_HOST:-./config/access.example.json}
        target: /etc/mcp-ozon/access.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DAILY_REPORT_POLICY_HOST:-./config/daily-report-pilot.example.json}
        target: /etc/mcp-ozon/daily-report-policy.json
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      position-db:
        condition: service_healthy
      ozon-egress:
        condition: service_healthy
    networks:
      - position-internal
      - ozon-egress-internal
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/report-collector", "healthcheck"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 10s

  report-worker:
    image: ${MCP_REPORT_WORKER_IMAGE:-mcp-ozon-report-worker:local}
    build:
      context: .
      dockerfile: Dockerfile.report-worker
      args:
        MCP_RELEASE_GIT_SHA: ${MCP_RELEASE_GIT_SHA:-unverified}
    environment:
      REPORT_WORKER_MODE: disabled
      REPORT_WORKER_DATABASE_URL: postgresql://report_worker:${REPORT_WORKER_DB_PASSWORD:?REPORT_WORKER_DB_PASSWORD is required}@position-db:5432/${POSITION_DB_NAME:-ozon_positions}
      MCP_ACCESS_CONFIG: /etc/mcp-ozon/access.json
      DAILY_REPORT_POLICY: /etc/mcp-ozon/daily-report-policy.json
      REPORT_ARTIFACT_ROOT: /var/lib/mcp-ozon/report-artifacts
      RUST_LOG: mcp_ozon::reporting=info
    volumes:
      - type: bind
        source: ${MCP_ACCESS_CONFIG_HOST:-./config/access.example.json}
        target: /etc/mcp-ozon/access.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${DAILY_REPORT_POLICY_HOST:-./config/daily-report-pilot.example.json}
        target: /etc/mcp-ozon/daily-report-policy.json
        read_only: true
        bind:
          create_host_path: false
      - type: volume
        source: report-artifacts
        target: /var/lib/mcp-ozon/report-artifacts
    depends_on:
      position-db:
        condition: service_healthy
    networks:
      - position-internal
    restart: unless-stopped
    mem_limit: 192m
    cpus: 0.5
    pids_limit: 64
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "/usr/local/bin/report-worker", "healthcheck"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 10s

networks:
  position-internal:
    name: mcp-ozon-position-internal
    internal: true
  ozon-egress-internal:
    name: mcp-ozon-egress-internal
    internal: true
  outbound:
    name: mcp-ozon-outbound
    external: true

volumes:
  position-data:
    name: mcp-ozon-position-data
  report-artifacts:
    name: mcp-ozon-report-artifacts
