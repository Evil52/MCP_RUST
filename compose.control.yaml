name: mcp-ozon-control

services:
  control:
    container_name: mcp-ozon-control
    image: ${MCP_CONTROL_IMAGE:-mcp-ozon-control:local}
    build:
      context: .
      dockerfile: Dockerfile.control
      args:
        MCP_RELEASE_GIT_SHA: ${MCP_RELEASE_GIT_SHA:-unverified}
    environment:
      CONTROL_MCP_TRANSPORT: http
      CONTROL_MCP_BIND: 0.0.0.0:8790
      CONTROL_MCP_AUTH_MODE: dev
      CONTROL_MCP_ACTOR_ID: ${CONTROL_MCP_ACTOR_ID:-admin}
      CONTROL_MCP_DEV_ALLOW_NON_LOOPBACK: "true"
      CONTROL_MCP_ACCESS_CONFIG: /etc/mcp-ozon/access.json
      CONTROL_MCP_POLICY: /etc/mcp-ozon/control-policy.json
      CONTROL_MCP_MAX_SESSIONS: "64"
      CONTROL_MCP_SESSION_IDLE_TIMEOUT_SECONDS: "120"
      RUST_LOG: mcp_ozon::control=info,rmcp=info
    networks:
      - control_isolated
      - control_ingress_internal
    volumes:
      - type: bind
        source: ${CONTROL_MCP_ACCESS_CONFIG_HOST:-./config/access.example.json}
        target: /etc/mcp-ozon/access.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CONTROL_MCP_POLICY_HOST:-./config/control-policy.example.json}
        target: /etc/mcp-ozon/control-policy.json
        read_only: true
        bind:
          create_host_path: false
    restart: unless-stopped
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 70s
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "2"
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8790/readyz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  control-ingress:
    image: ${MCP_CONTROL_INGRESS_IMAGE:-mcp-ozon-control-ingress:local}
    build:
      context: .
      dockerfile: Dockerfile.control-ingress
      args:
        MCP_RELEASE_GIT_SHA: ${MCP_RELEASE_GIT_SHA:-unverified}
    ports:
      - "127.0.0.1:8790:8790"
    networks:
      - control_ingress_internal
      - control_host_ingress
    restart: unless-stopped
    mem_limit: 32m
    cpus: 0.10
    pids_limit: 32
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "nc -z -w 3 127.0.0.1 8790"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

networks:
  control_isolated:
    driver: bridge
    internal: true
    driver_opts:
      com.docker.network.bridge.enable_icc: "false"
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
  control_ingress_internal:
    driver: bridge
    internal: true
  control_host_ingress:
    driver: bridge
