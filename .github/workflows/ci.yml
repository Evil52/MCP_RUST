name: Rust CI

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "41 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install project Rust with quality components
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Reject accidentally committed local secrets
        run: |
          prohibited_files='(^|/)(\.env|\.position\.env|\.sonar\.env|\.sonar-stack\.env|sonar\.env|config/access(\.canary)?\.json)$'
          if git ls-files | grep -E "$prohibited_files"; then
            echo "Local secret or private configuration files must never be committed." >&2
            exit 1
          fi

      - name: Validate workflows with actionlint
        run: |
          actionlint_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$actionlint_dir/actionlint.tar.gz"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' \
            | (cd "$actionlint_dir" && sha256sum --check)
          tar --extract --gzip --file "$actionlint_dir/actionlint.tar.gz" --directory "$actionlint_dir"
          "$actionlint_dir/actionlint" -color

      - name: Check shell scripts
        run: |
          command -v shellcheck >/dev/null
          shellcheck --version
          shellcheck scripts/*.sh position-monitor/*.sh position-monitor/initdb/*.sh
          ./scripts/test-release-image-lock.sh
          if git grep -n -I -E -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sqp_[[:alnum:]_-]{20,}'; then
            echo "A likely private key or Sonar token is committed." >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked --all-targets --all-features -- --test-threads=1

      - name: Verify PostgreSQL repository transaction contract
        run: ./scripts/with-position-test-db.sh ./scripts/test-position-runtime.sh

      - name: Run Clippy with pedantic warnings denied
        # Cargo.toml sets clippy::all and clippy::pedantic to deny while
        # retaining the explicit legacy-debt allowlist.
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features

  rust-version:
    name: Rust 1.98.0
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install project Rust version
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test project Rust version
        run: cargo +1.98.0 test --locked --all-targets --all-features -- --test-threads=1

  coverage:
    name: Core library source lines
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install project Rust
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component llvm-tools-preview

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install verified cargo-llvm-cov
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Enforce core-library coverage baseline
        run: >-
          ./scripts/with-position-test-db.sh
          cargo llvm-cov
          --locked
          --all-targets
          --all-features
          --ignore-filename-regex 'src/(main|bin/(mcp-ozon-control|position-collector|report-collector|report-worker|wb-automation))\.rs$'
          --show-missing-lines
          --fail-under-functions 100
          --fail-under-lines 99.9

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install project Rust
        run: rustup toolchain install 1.98.0 --profile minimal

      - name: Install verified security tools
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.19.9

      - name: Audit Cargo.lock against RustSec
        run: cargo audit --deny warnings

      - name: Check advisories, licenses, bans, and sources
        run: cargo deny check

      # `[patch.crates-io]` points rmcp at vendor/rmcp, so its Cargo.lock entry
      # carries no source and no checksum. Dependabot cannot propose an update
      # for a path patch, which leaves the vendored transport as the one
      # dependency nothing watches. The version agreement below is enforced on
      # every run; the upstream comparison needs the network and would block
      # unrelated pull requests, so it is fatal only on the weekly schedule.
      - name: Check the vendored rmcp fork against upstream
        env:
          ENFORCE_UPSTREAM: >-
            ${{ github.event_name == 'schedule'
            || github.event_name == 'workflow_dispatch' }}
        run: |
          pinned="$(sed -n 's/^rmcp = { version = "=\([0-9][0-9.]*\)".*/\1/p' Cargo.toml)"
          vendored="$(sed -n 's/^version = "\([0-9][0-9.]*\)".*/\1/p' vendor/rmcp/Cargo.toml | head -n 1)"
          documented="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' vendor/rmcp/UPSTREAM.md | head -n 1)"
          if [ -z "$pinned" ] || [ -z "$vendored" ] || [ -z "$documented" ]; then
            echo "could not resolve the vendored rmcp version" >&2
            exit 1
          fi
          if [ "$pinned" != "$vendored" ] || [ "$pinned" != "$documented" ]; then
            echo "vendored rmcp version disagrees:" >&2
            echo "  Cargo.toml pin:            $pinned" >&2
            echo "  vendor/rmcp/Cargo.toml:    $vendored" >&2
            echo "  vendor/rmcp/UPSTREAM.md:   $documented" >&2
            exit 1
          fi
          latest="$(
            curl --fail --silent --show-error --location \
              --header 'User-Agent: mcp-ozon-ci' \
              https://crates.io/api/v1/crates/rmcp \
              | jq -r '.crate.max_stable_version'
          )"
          if [ "$latest" = "$pinned" ]; then
            echo "vendored rmcp $pinned matches the latest published release"
            exit 0
          fi
          echo "upstream rmcp is $latest; vendor/rmcp is pinned at $pinned." >&2
          echo "Re-vendor it, reapply the local modifications listed in" >&2
          echo "vendor/rmcp/UPSTREAM.md, and update the recorded version," >&2
          echo "checksum and upstream commit." >&2
          if [ "$ENFORCE_UPSTREAM" = "true" ]; then
            exit 1
          fi
          echo "::warning::vendored rmcp $pinned is behind upstream $latest"

  container:
    name: Hardened container
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify hardening declared by the shipped Compose files
        run: ./scripts/verify-compose-hardening.sh

      - name: Verify position database schema and restricted roles
        env:
          POSITION_SCHEMA_TEST_IMAGE: mcp-ozon-position-db:ci
          POSITION_SCHEMA_TEST_KEEP_IMAGE: "true"
          MCP_RELEASE_GIT_SHA: ${{ github.sha }}
        run: ./scripts/test-position-schema.sh

      - name: Build every shipped runtime image at the tested revision
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          build() {
            local tag="$1"
            local dockerfile="$2"
            local context="${3:-.}"
            docker build --pull \
              --build-arg "MCP_RELEASE_GIT_SHA=$RELEASE_SHA" \
              --tag "$tag" --file "$dockerfile" "$context"
          }
          build mcp-ozon:ci Dockerfile
          build mcp-ozon-control:ci Dockerfile.control
          build mcp-ozon-position-collector:ci Dockerfile.position-collector
          build mcp-ozon-report-collector:ci Dockerfile.report-collector
          build mcp-ozon-report-worker:ci Dockerfile.report-worker
          build mcp-ozon-wb-automation:ci Dockerfile.wb-automation-shadow
          build mcp-ozon-egress:ci Dockerfile.ozon-egress
          build mcp-ozon-control-ingress:ci Dockerfile.control-ingress
          build mcp-ozon-control-auth-egress:ci Dockerfile.control-auth-egress
          build mcp-ozon-control-write-egress:ci Dockerfile.control-write-egress
          build mcp-ozon-mail-egress:ci Dockerfile.mail-egress

      - name: Verify every image carries the tested revision
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          images=(
            mcp-ozon:ci
            mcp-ozon-control:ci
            mcp-ozon-position-db:ci
            mcp-ozon-position-collector:ci
            mcp-ozon-report-collector:ci
            mcp-ozon-report-worker:ci
            mcp-ozon-wb-automation:ci
            mcp-ozon-egress:ci
            mcp-ozon-control-ingress:ci
            mcp-ozon-control-auth-egress:ci
            mcp-ozon-control-write-egress:ci
            mcp-ozon-mail-egress:ci
          )
          for image in "${images[@]}"; do
            test "$(docker image inspect \
              --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' \
              "$image")" = "$RELEASE_SHA"
          done

      - name: Verify minimal static musl runtime
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' mcp-ozon:ci)" = "mcp"
          docker run --rm --entrypoint /bin/sh mcp-ozon:ci -ec '
            test -f /etc/alpine-release
            test -r /etc/ssl/certs/ca-certificates.crt
            command -v wget >/dev/null
            if command -v curl >/dev/null; then
              echo "curl must not be present in the runtime image" >&2
              exit 1
            fi
            if ldd /usr/local/bin/mcp-ozon 2>&1 | grep -q "=>"; then
              echo "the runtime binary must not have dynamic dependencies" >&2
              ldd /usr/local/bin/mcp-ozon >&2 2>&1
              exit 1
            fi
          '
          test "$(docker image inspect --format '{{.Config.User}}' mcp-ozon-position-collector:ci)" = "collector"
          docker run --rm --entrypoint /bin/sh mcp-ozon-position-collector:ci -ec '
            test -f /etc/alpine-release
            if ldd /usr/local/bin/position-collector 2>&1 | grep -q "=>"; then
              echo "the collector runtime binary must not have dynamic dependencies" >&2
              ldd /usr/local/bin/position-collector >&2 2>&1
              exit 1
            fi
          '

      - name: Install verified Trivy
        run: |
          trivy_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location \
            https://github.com/aquasecurity/trivy/releases/download/v0.73.0/trivy_0.73.0_Linux-64bit.tar.gz \
            --output "$trivy_dir/trivy.tar.gz"
          echo '2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b  trivy.tar.gz' \
            | (cd "$trivy_dir" && sha256sum --check)
          tar --extract --gzip --file "$trivy_dir/trivy.tar.gz" --directory "$trivy_dir"
          sudo install --mode 0755 "$trivy_dir/trivy" /usr/local/bin/trivy

      - name: Scan repository for secrets and misconfiguration
        run: >-
          trivy filesystem
          --scanners secret,misconfig
          --severity HIGH,CRITICAL
          --exit-code 1
          --skip-dirs target
          .

      - name: Scan every shipped image for fixable high and critical vulnerabilities
        run: |
          images=(
            mcp-ozon:ci
            mcp-ozon-control:ci
            mcp-ozon-position-db:ci
            mcp-ozon-position-collector:ci
            mcp-ozon-report-collector:ci
            mcp-ozon-report-worker:ci
            mcp-ozon-wb-automation:ci
            mcp-ozon-egress:ci
            mcp-ozon-control-ingress:ci
            mcp-ozon-control-auth-egress:ci
            mcp-ozon-control-write-egress:ci
            mcp-ozon-mail-egress:ci
          )
          for image in "${images[@]}"; do
            trivy image \
              --scanners vuln,secret \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              "$image"
          done

      - name: Start hardened container and verify health
        run: |
          docker run --detach \
            --name mcp-ozon-ci \
            --read-only \
            --tmpfs /tmp:size=16m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges=true \
            --env MCP_ACTOR_ID=admin \
            --env MCP_DEV_ALLOW_NON_LOOPBACK=true \
            --env MCP_MAX_SESSIONS=8 \
            --env MCP_SESSION_IDLE_TIMEOUT_SECONDS=90 \
            --publish 127.0.0.1:8787:8787 \
            mcp-ozon:ci

          cleanup() {
            docker logs mcp-ozon-ci || true
            docker rm --force mcp-ozon-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8787/readyz; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "Container did not become healthy." >&2
              exit 1
            fi
            sleep 1
          done

          test "$(docker inspect --format '{{.Config.User}}' mcp-ozon-ci)" = "mcp"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' mcp-ozon-ci)" = "true"
          test "$(docker inspect --format '{{join .HostConfig.CapDrop ","}}' mcp-ozon-ci)" = "ALL"
          docker inspect --format '{{join .HostConfig.SecurityOpt ","}}' mcp-ozon-ci \
            | grep --fixed-strings 'no-new-privileges=true'

          # Exercise the optimized release binary without marketplace access.
          # The harness exposes only schema listing and the process-local
          # list_members tool, then proves controlled overload and recovery.
          python3 scripts/mcp-session-load-smoke.py \
            --url http://127.0.0.1:8787/mcp \
            --mode local \
            --clients 8 \
            --calls 5 \
            --timeout-seconds 10
          python3 scripts/mcp-session-load-smoke.py \
            --url http://127.0.0.1:8787/mcp \
            --mode schema \
            --clients 32 \
            --calls 3 \
            --timeout-seconds 10 \
            --expect-overload

  publish-images:
    name: Publish ${{ matrix.id }}
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [quality, rust-version, coverage, dependency-security, container]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      attestations: write
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - id: server
            context: .
            dockerfile: Dockerfile
          - id: control
            context: .
            dockerfile: Dockerfile.control
          - id: position-db
            context: position-monitor
            dockerfile: position-monitor/Dockerfile
          - id: position-collector
            context: .
            dockerfile: Dockerfile.position-collector
          - id: report-collector
            context: .
            dockerfile: Dockerfile.report-collector
          - id: report-worker
            context: .
            dockerfile: Dockerfile.report-worker
          - id: wb-automation
            context: .
            dockerfile: Dockerfile.wb-automation-shadow
          - id: ozon-egress
            context: .
            dockerfile: Dockerfile.ozon-egress
          - id: control-ingress
            context: .
            dockerfile: Dockerfile.control-ingress
          - id: control-auth-egress
            context: .
            dockerfile: Dockerfile.control-auth-egress
          - id: control-write-egress
            context: .
            dockerfile: Dockerfile.control-write-egress
          - id: mail-egress
            context: .
            dockerfile: Dockerfile.mail-egress
    env:
      GHCR_PACKAGE: ghcr.io/evil52/mcp-rust-runtime
    steps:
      - name: Checkout the exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Require a public GHCR package
        env:
          GHCR_PUBLISH_TOKEN: ${{ secrets.GHCR_PUBLISH_TOKEN }}
        run: |
          if [[ -z "$GHCR_PUBLISH_TOKEN" ]]; then
            echo "GHCR_PUBLISH_TOKEN with only write:packages is required." >&2
            exit 1
          fi
          response="$RUNNER_TEMP/ghcr-package.json"
          status="$(curl --silent --show-error \
            --header "Authorization: Bearer $GHCR_PUBLISH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --output "$response" --write-out '%{http_code}' \
            https://api.github.com/users/Evil52/packages/container/mcp-rust-runtime)"
          case "$status" in
            200)
              jq -e '.visibility == "public"' "$response" >/dev/null \
                || { echo "existing GHCR package is not public" >&2; exit 1; }
              ;;
            404)
              echo "package does not exist yet; the first publish requires an administrator to make it public before rerunning this workflow"
              ;;
            *)
              echo "could not verify GHCR package visibility (HTTP $status)" >&2
              exit 1
              ;;
          esac

      - name: Log in to GHCR publisher
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: Evil52
          password: ${{ secrets.GHCR_PUBLISH_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build and publish the multi-platform candidate
        id: publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.GHCR_PACKAGE }}:candidate-${{ github.sha }}-${{ matrix.id }}
          build-args: MCP_RELEASE_GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=release-${{ matrix.id }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.id }}
          provenance: false
          sbom: false

      - name: Confirm package remained public
        env:
          GHCR_PUBLISH_TOKEN: ${{ secrets.GHCR_PUBLISH_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $GHCR_PUBLISH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            https://api.github.com/users/Evil52/packages/container/mcp-rust-runtime \
            | jq -e '.visibility == "public"' >/dev/null

      - name: Attest the immutable image digest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.GHCR_PACKAGE }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true

      - name: Install verified Trivy
        run: |
          trivy_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location \
            https://github.com/aquasecurity/trivy/releases/download/v0.73.0/trivy_0.73.0_Linux-64bit.tar.gz \
            --output "$trivy_dir/trivy.tar.gz"
          echo '2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b  trivy.tar.gz' \
            | (cd "$trivy_dir" && sha256sum --check)
          tar --extract --gzip --file "$trivy_dir/trivy.tar.gz" --directory "$trivy_dir"
          sudo install --mode 0755 "$trivy_dir/trivy" /usr/local/bin/trivy

      - name: Scan and inspect both published platforms
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Buildx returned an invalid image digest." >&2
            exit 1
          fi
          reference="$GHCR_PACKAGE@$IMAGE_DIGEST"
          for platform in linux/amd64 linux/arm64; do
            trivy image \
              --platform "$platform" \
              --scanners vuln,secret \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              "$reference"
            docker pull --platform "$platform" "$reference"
            actual_revision="$(docker image inspect \
              --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' \
              "$reference")"
            test "$actual_revision" = "$RELEASE_SHA"
            docker image rm "$reference" >/dev/null
          done

      - name: Write immutable image fragment
        env:
          IMAGE_DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          mkdir -p target/release-image-fragment
          jq -n \
            --arg id "${{ matrix.id }}" \
            --arg git_sha "$GITHUB_SHA" \
            --arg repository "$GITHUB_REPOSITORY" \
            --arg reference "$GHCR_PACKAGE@$IMAGE_DIGEST" '
            {
              schema_version: 1,
              id: $id,
              git_sha: $git_sha,
              repository: $repository,
              platforms: ["linux/amd64", "linux/arm64"],
              reference: $reference
            }
          ' >"target/release-image-fragment/${{ matrix.id }}.json"

      - name: Publish verified image fragment
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcp-ozon-image-${{ matrix.id }}-${{ github.sha }}
          path: target/release-image-fragment/${{ matrix.id }}.json
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  release-evidence:
    name: Release evidence
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    needs: [publish-images]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout the exact tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download every verified image fragment
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mcp-ozon-image-*-${{ github.sha }}
          path: target/release-image-fragments
          merge-multiple: true

      - name: Write immutable release image lock
        run: >-
          ./scripts/create-release-image-lock.sh
          target/release-image-fragments
          "$GITHUB_SHA"
          "$GITHUB_REPOSITORY"
          target/release-evidence/release-images.json

      - name: Write immutable release identity
        run: >-
          ./scripts/write-release-evidence.sh
          "$GITHUB_SHA"
          "$GITHUB_REPOSITORY"
          "$GITHUB_RUN_ID"
          target/release-evidence/release-images.json
          target/release-evidence/release.json

      - name: Publish release identity after every required gate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcp-ozon-release-${{ github.sha }}
          path: |
            target/release-evidence/release.json
            target/release-evidence/release-images.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
