name: Rust CI

on:
  pull_request:
  push:
    branches: [main, master]
  schedule:
    - cron: "41 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rust-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  CARGO_NET_RETRY: "10"
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install project Rust with quality components
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Reject accidentally committed local secrets
        run: |
          prohibited_files='(^|/)(\.env|\.position\.env|\.sonar\.env|\.sonar-stack\.env|sonar\.env|config/access(\.canary)?\.json)$'
          if git ls-files | grep -E "$prohibited_files"; then
            echo "Local secret or private configuration files must never be committed." >&2
            exit 1
          fi

      - name: Validate workflows with actionlint
        run: |
          actionlint_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
            --output "$actionlint_dir/actionlint.tar.gz"
          echo '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  actionlint.tar.gz' \
            | (cd "$actionlint_dir" && sha256sum --check)
          tar --extract --gzip --file "$actionlint_dir/actionlint.tar.gz" --directory "$actionlint_dir"
          "$actionlint_dir/actionlint" -color

      - name: Check shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends shellcheck
          shellcheck scripts/*.sh position-monitor/*.sh position-monitor/initdb/*.sh
          if git grep -n -I -E -- '-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----|sqp_[[:alnum:]_-]{20,}'; then
            echo "A likely private key or Sonar token is committed." >&2
            exit 1
          fi

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run tests
        run: cargo test --locked --all-targets --all-features

      - name: Verify PostgreSQL repository transaction contract
        run: ./scripts/with-position-test-db.sh ./scripts/test-position-runtime.sh

      - name: Run Clippy with warnings denied
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Build documentation with warnings denied
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps --all-features

  rust-version:
    name: Rust 1.97.1
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install project Rust version
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Test project Rust version
        run: cargo +1.97.1 test --locked --all-targets --all-features

  coverage:
    name: Coverage 100%
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install project Rust
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component llvm-tools-preview

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install verified cargo-llvm-cov
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-llvm-cov@0.8.7

      - name: Enforce complete line coverage
        run: >-
          ./scripts/with-position-test-db.sh
          cargo llvm-cov
          --locked
          --all-targets
          --all-features
          --ignore-filename-regex 'src/(main|bin/(mcp-ozon-control|position-collector))\.rs$'
          --show-missing-lines
          --fail-under-lines 100

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install project Rust
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: Install verified security tools
        uses: taiki-e/install-action@82cd3e7658a6f96c86c0234aeeda1748937cb0a1 # v2.85.13
        with:
          tool: cargo-audit@0.22.2,cargo-deny@0.19.9

      - name: Audit Cargo.lock against RustSec
        run: cargo audit --deny warnings

      - name: Check advisories, licenses, bans, and sources
        run: cargo deny check

  container:
    name: Hardened container
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify hardening declared by the shipped Compose files
        run: ./scripts/verify-compose-hardening.sh

      - name: Verify position database schema and restricted roles
        env:
          POSITION_SCHEMA_TEST_IMAGE: mcp-ozon-position-db:ci
          POSITION_SCHEMA_TEST_KEEP_IMAGE: "true"
        run: ./scripts/test-position-schema.sh

      - name: Build image
        run: |
          docker build --pull --tag mcp-ozon:ci .
          docker build --pull --tag mcp-ozon-position-collector:ci \
            --file Dockerfile.position-collector .

      - name: Verify minimal static musl runtime
        run: |
          test "$(docker image inspect --format '{{.Config.User}}' mcp-ozon:ci)" = "mcp"
          docker run --rm --entrypoint /bin/sh mcp-ozon:ci -ec '
            test -f /etc/alpine-release
            test -r /etc/ssl/certs/ca-certificates.crt
            command -v wget >/dev/null
            if command -v curl >/dev/null; then
              echo "curl must not be present in the runtime image" >&2
              exit 1
            fi
            if ldd /usr/local/bin/mcp-ozon 2>&1 | grep -q "=>"; then
              echo "the runtime binary must not have dynamic dependencies" >&2
              ldd /usr/local/bin/mcp-ozon >&2 2>&1
              exit 1
            fi
          '
          test "$(docker image inspect --format '{{.Config.User}}' mcp-ozon-position-collector:ci)" = "collector"
          docker run --rm --entrypoint /bin/sh mcp-ozon-position-collector:ci -ec '
            test -f /etc/alpine-release
            if ldd /usr/local/bin/position-collector 2>&1 | grep -q "=>"; then
              echo "the collector runtime binary must not have dynamic dependencies" >&2
              ldd /usr/local/bin/position-collector >&2 2>&1
              exit 1
            fi
          '

      - name: Install verified Trivy
        run: |
          trivy_dir="$(mktemp -d)"
          curl --fail --silent --show-error --location \
            https://github.com/aquasecurity/trivy/releases/download/v0.73.0/trivy_0.73.0_Linux-64bit.tar.gz \
            --output "$trivy_dir/trivy.tar.gz"
          echo '2edd39da482bb4e9831962487b68f68e3928ec3137794757f54d00383d79547b  trivy.tar.gz' \
            | (cd "$trivy_dir" && sha256sum --check)
          tar --extract --gzip --file "$trivy_dir/trivy.tar.gz" --directory "$trivy_dir"
          sudo install --mode 0755 "$trivy_dir/trivy" /usr/local/bin/trivy

      - name: Scan repository for secrets and misconfiguration
        run: >-
          trivy filesystem
          --scanners secret,misconfig
          --severity HIGH,CRITICAL
          --exit-code 1
          --skip-dirs target
          .

      - name: Scan image for fixable high and critical vulnerabilities
        run: >-
          trivy image
          --scanners vuln,secret
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --exit-code 1
          mcp-ozon:ci

      - name: Scan position database image for fixable high and critical vulnerabilities
        run: >-
          trivy image
          --scanners vuln,secret
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --exit-code 1
          mcp-ozon-position-db:ci

      - name: Scan position collector image for fixable high and critical vulnerabilities
        run: >-
          trivy image
          --scanners vuln,secret
          --severity HIGH,CRITICAL
          --ignore-unfixed
          --exit-code 1
          mcp-ozon-position-collector:ci

      - name: Start hardened container and verify health
        run: |
          docker run --detach \
            --name mcp-ozon-ci \
            --read-only \
            --tmpfs /tmp:size=16m,mode=1777 \
            --cap-drop ALL \
            --security-opt no-new-privileges=true \
            --env MCP_ACTOR_ID=admin \
            --env MCP_DEV_ALLOW_NON_LOOPBACK=true \
            --env MCP_MAX_SESSIONS=8 \
            --env MCP_SESSION_IDLE_TIMEOUT_SECONDS=90 \
            --publish 127.0.0.1:8787:8787 \
            mcp-ozon:ci

          cleanup() {
            docker logs mcp-ozon-ci || true
            docker rm --force mcp-ozon-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:8787/health; then
              break
            fi
            if [[ "$attempt" == "30" ]]; then
              echo "Container did not become healthy." >&2
              exit 1
            fi
            sleep 1
          done

          test "$(docker inspect --format '{{.Config.User}}' mcp-ozon-ci)" = "mcp"
          test "$(docker inspect --format '{{.HostConfig.ReadonlyRootfs}}' mcp-ozon-ci)" = "true"
          test "$(docker inspect --format '{{join .HostConfig.CapDrop ","}}' mcp-ozon-ci)" = "ALL"
          docker inspect --format '{{join .HostConfig.SecurityOpt ","}}' mcp-ozon-ci \
            | grep --fixed-strings 'no-new-privileges=true'

          # Exercise the optimized release binary without marketplace access.
          # The harness exposes only schema listing and the process-local
          # list_members tool, then proves controlled overload and recovery.
          python3 scripts/mcp-session-load-smoke.py \
            --url http://127.0.0.1:8787/mcp \
            --mode local \
            --clients 8 \
            --calls 5 \
            --timeout-seconds 10
          python3 scripts/mcp-session-load-smoke.py \
            --url http://127.0.0.1:8787/mcp \
            --mode schema \
            --clients 32 \
            --calls 3 \
            --timeout-seconds 10 \
            --expect-overload
