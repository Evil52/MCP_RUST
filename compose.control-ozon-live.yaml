services:
  control:
    environment:
      # MCP ingress remains a planner in the live topology. Only the separate
      # durable executor below owns marketplace write credentials.
      CONTROL_MCP_MARKETPLACE_WRITES_ENABLED: "false"

  ozon-campaign-guard:
    image: ${MCP_CONTROL_IMAGE:-mcp-ozon-control:local}
    build:
      context: .
      dockerfile: Dockerfile.control
      args:
        MCP_RELEASE_GIT_SHA: ${MCP_RELEASE_GIT_SHA:-unverified}
    entrypoint: ["/usr/local/bin/ozon-campaign-guard"]
    environment:
      CONTROL_MCP_TRANSPORT: http
      CONTROL_MCP_BIND: 127.0.0.1:8790
      CONTROL_MCP_AUTH_MODE: jwt
      CONTROL_MCP_JWT_ISSUER: ${CONTROL_MCP_JWT_ISSUER:?CONTROL_MCP_JWT_ISSUER is required}
      CONTROL_MCP_JWT_JWKS_URL: http://control-auth-egress:8080/jwks
      CONTROL_MCP_PUBLIC_URL: ${CONTROL_MCP_PUBLIC_URL:?CONTROL_MCP_PUBLIC_URL is required}
      CONTROL_MCP_JWT_AUDIENCE: ${CONTROL_MCP_PUBLIC_URL:?CONTROL_MCP_PUBLIC_URL is required}
      CONTROL_MCP_ACCESS_CONFIG: /etc/mcp-ozon/access.json
      CONTROL_MCP_POLICY: /etc/mcp-ozon/control-policy.json
      CONTROL_MCP_MARKETPLACE_WRITES_ENABLED: "true"
      CONTROL_MCP_OZON_ACCOUNT_ID: furnitura_dlya_doma
      CONTROL_MCP_OZON_EXECUTOR_DATABASE_URL: postgresql://ozon_control_executor:${OZON_CONTROL_EXECUTOR_DB_PASSWORD:?OZON_CONTROL_EXECUTOR_DB_PASSWORD is required}@position-db:5432/${POSITION_DB_NAME:-ozon_positions}
      CONTROL_MCP_OZON_EXECUTOR_PERFORMANCE_CLIENT_ID_FILE: /run/mcp-ozon/control-credentials/ozon-executor-performance-client-id
      CONTROL_MCP_OZON_EXECUTOR_PERFORMANCE_CLIENT_SECRET_FILE: /run/mcp-ozon/control-credentials/ozon-executor-performance-client-secret
      CONTROL_MCP_OZON_PROXY: http://control-ozon-write-egress:3130
      CONTROL_MCP_OZON_TIMEOUT_SECONDS: "20"
      RUST_LOG: mcp_ozon::control::ozon=info
    volumes:
      - type: bind
        source: ${CONTROL_MCP_ACCESS_CONFIG_HOST:?CONTROL_MCP_ACCESS_CONFIG_HOST is required}
        target: /etc/mcp-ozon/access.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CONTROL_MCP_POLICY_HOST:?CONTROL_MCP_POLICY_HOST is required}
        target: /etc/mcp-ozon/control-policy.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CONTROL_MCP_OZON_EXECUTOR_PERFORMANCE_CLIENT_ID_FILE_HOST:?dedicated Ozon workflow executor Performance Client-Id file is required}
        target: /run/mcp-ozon/control-credentials/ozon-executor-performance-client-id
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${CONTROL_MCP_OZON_EXECUTOR_PERFORMANCE_CLIENT_SECRET_FILE_HOST:?dedicated Ozon workflow executor Performance Client-Secret file is required}
        target: /run/mcp-ozon/control-credentials/ozon-executor-performance-client-secret
        read_only: true
        bind:
          create_host_path: false
    networks:
      - position-internal
      - control-ozon-write-egress-internal
    depends_on:
      control-ozon-write-egress:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=8m,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - "set -- $$(pidof ozon-campaign-guard) && test \"$$#\" -eq 1 && exec /usr/local/bin/ozon-campaign-guard healthcheck"
      interval: 15s
      timeout: 8s
      retries: 3
      start_period: 15s

  control-ozon-write-egress:
    image: ${MCP_CONTROL_OZON_WRITE_EGRESS_IMAGE:-mcp-ozon-control-ozon-write-egress:local}
    build:
      context: .
      dockerfile: Dockerfile.control-ozon-write-egress
      args:
        MCP_RELEASE_GIT_SHA: ${MCP_RELEASE_GIT_SHA:-unverified}
    networks:
      - control-ozon-write-egress-internal
      - outbound
    restart: unless-stopped
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 32
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /var/cache/squid:size=4m,mode=1777
      - /var/log/squid:size=2m,mode=1777
      - /var/run/squid:size=1m,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - "printf 'GET http://healthcheck.invalid/ HTTP/1.0\r\n\r\n' | nc -w 3 127.0.0.1 3130 | head -1 | grep -q '403 Forbidden'"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 10s

networks:
  control-ozon-write-egress-internal:
    internal: true
