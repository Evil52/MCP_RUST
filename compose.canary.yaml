name: mcp-ozon-canary

services:
  server:
    container_name: mcp-ozon-canary
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      MCP_TRANSPORT: http
      MCP_BIND: 0.0.0.0:8787
      MCP_ACCESS_CONFIG: /etc/mcp-ozon/access.json
      OZON_POSTINGS_VNEXT: "true"
      OZON_FINANCE_ACCRUALS_PREVIEW: "true"
    ports:
      - "127.0.0.1:8789:8787"
    volumes:
      - type: bind
        source: ${MCP_CANARY_ACCESS_CONFIG:-./config/access.canary.json}
        target: /etc/mcp-ozon/access.json
        read_only: true
        bind:
          create_host_path: false
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8787/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
