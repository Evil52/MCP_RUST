name: Security

# Forgejo replacements for the GitHub-hosted CodeQL and dependency-review
# checks: Semgrep for static analysis, gitleaks for secrets in full history.
# cargo-audit, cargo-deny and Trivy already run in ci.yml.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned Semgrep
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install --quiet 'semgrep==1.179.0'

      - name: Static analysis, findings fail the build
        env:
          SEMGREP_SEND_METRICS: "off"
          SEMGREP_ENABLE_VERSION_CHECK: "0"
        run: >-
          "$RUNNER_TEMP/semgrep/bin/semgrep" scan
          --config p/rust
          --config p/security-audit
          --config p/secrets
          --config p/dockerfile
          --config p/github-actions
          --metrics off
          --error
          --exclude vendor
          --exclude target
          --exclude .worktrees
          --exclude output
          .

  gitleaks:
    name: Secrets in git history
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified gitleaks
        run: |
          dir="$(mktemp -d)"
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$dir/gitleaks.tar.gz"
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz' \
            | (cd "$dir" && sha256sum --check)
          tar --extract --gzip --file "$dir/gitleaks.tar.gz" --directory "$dir"
          install -m 0755 "$dir/gitleaks" /usr/local/bin/gitleaks

      - name: Scan every commit
        run: gitleaks git --redact --verbose --exit-code 1 .
