# The daily reporting collector reaches the marketplace through this one
# narrowly scoped CONNECT proxy. It has no cache and no access log: request
# headers include Seller API credentials and must never be persisted here.
http_port 3128
visible_hostname ozon-egress
pid_filename /var/run/squid/squid.pid

cache deny all
cache_mem 0 MB
maximum_object_size 0 KB
access_log none
cache_log /dev/stderr

acl tls_port port 443
acl ozon_read_api dstdomain api-seller.ozon.ru api-performance.ozon.ru
acl connect method CONNECT

# Only TLS tunnels to the two read-only Ozon API hosts used by the report
# collector are permitted. This deliberately denies IP literals, other Ozon
# subdomains, plaintext HTTP and every other destination.
http_access allow connect ozon_read_api tls_port
http_access deny all
