# The report worker reaches Google only through this narrow CONNECT proxy.
# OAuth form values and Gmail message bodies remain inside TLS and are never
# logged or cached by Squid.
http_port 3129
visible_hostname mail-egress
pid_filename /var/run/squid/squid.pid

cache deny all
cache_mem 0 MB
maximum_object_size 0 KB
access_log none
cache_log /dev/stderr

acl tls_port port 443
acl google_mail_api dstdomain oauth2.googleapis.com gmail.googleapis.com
acl connect method CONNECT

# Only TLS tunnels to the two fixed hosts compiled into the report worker are
# allowed. IP literals, other Google hosts, plaintext HTTP and every other
# destination are denied.
http_access allow connect google_mail_api tls_port
http_access deny all
