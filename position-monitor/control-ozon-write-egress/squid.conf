# Ozon Control can reach only the reviewed Performance API origin through
# this credentialless CONNECT proxy. OAuth and write bodies stay inside TLS;
# access logging and caching are disabled.
http_port 3130
visible_hostname control-ozon-write-egress
pid_filename /var/run/squid/squid.pid

cache deny all
cache_mem 0 MB
maximum_object_size 0 KB
access_log none
cache_log /dev/stderr

acl tls_port port 443
acl ozon_performance_api dstdomain api-performance.ozon.ru
acl connect method CONNECT

http_access allow connect ozon_performance_api tls_port
http_access deny all
