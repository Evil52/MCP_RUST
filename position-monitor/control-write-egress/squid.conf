# The Control process can reach the single reviewed WB Promotion origin only
# through this credentialless CONNECT proxy. Authorization remains inside TLS;
# caching and access logging are disabled so the token cannot be persisted.
http_port 3130
visible_hostname control-write-egress
pid_filename /var/run/squid/squid.pid

cache deny all
cache_mem 0 MB
maximum_object_size 0 KB
access_log none
cache_log /dev/stderr

acl tls_port port 443
acl wb_promotion_write_api dstdomain advert-api.wildberries.ru
acl connect method CONNECT

# Deny IP literals, every other marketplace host, plaintext HTTP and all
# non-CONNECT methods. The Rust writer independently fixes each request to the
# reviewed bid PATCH or campaign pause/start GET path, providing a second,
# application-level boundary.
http_access allow connect wb_promotion_write_api tls_port
http_access deny all
