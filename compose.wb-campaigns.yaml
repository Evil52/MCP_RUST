# Shared operator and fleet runner. One account profile, any registered campaigns.
# Image digests come from the verified immutable release, as for the existing robot.
name: mcp-ozon-wb-campaigns
services:
  wb-campaigns:
    image: ${MCP_WB_AUTOMATION_IMAGE:?verified WB automation image is required}
    command: [execute-fleet-pg, /var/lib/wb-campaigns/fleet.json]
    environment:
      WB_AUTOMATION_DATABASE_URL: postgresql://wb_automation_writer:${WB_AUTOMATION_DB_PASSWORD:?WB_AUTOMATION_DB_PASSWORD is required}@position-db:5432/${POSITION_DB_NAME:-ozon_positions}
      MCP_MARKETPLACE_QUOTA_REQUIRED: "true"
      MCP_MARKETPLACE_QUOTA_DATABASE_URL: postgresql://wb_automation_writer:${WB_AUTOMATION_DB_PASSWORD:?WB_AUTOMATION_DB_PASSWORD is required}@position-db:5432/${POSITION_DB_NAME:-ozon_positions}
    volumes:
      - type: bind
        source: ${WB_CAMPAIGNS_ROOT:?WB_CAMPAIGNS_ROOT is required}
        target: /var/lib/wb-campaigns
        bind: {create_host_path: false}
      - type: bind
        source: ${WB_AUTOMATION_ACCESS_CONFIG_HOST:?WB_AUTOMATION_ACCESS_CONFIG_HOST is required}
        target: /etc/mcp-ozon/access.json
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${WB_AUTOMATION_READ_TOKEN_FILE_HOST:?WB_AUTOMATION_READ_TOKEN_FILE_HOST is required}
        target: /run/secrets/wb-promotion-read.token
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ${WB_AUTOMATION_WRITE_TOKEN_FILE_HOST:?WB_AUTOMATION_WRITE_TOKEN_FILE_HOST is required}
        target: /run/secrets/wb-promotion-write.token
        read_only: true
        bind: {create_host_path: false}
    networks: [position-internal, ozon-egress-internal, write-egress-internal]
    depends_on:
      write-egress: {condition: service_healthy}
    restart: "no"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:size=8m,mode=1777"]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 64
    logging:
      driver: json-file
      options: {max-size: 1m, max-file: "2"}
  write-egress:
    container_name: ${WB_CAMPAIGNS_EGRESS_CONTAINER_NAME:-mcp-ozon-wb-campaigns-write-egress}
    image: ${MCP_CONTROL_WRITE_EGRESS_IMAGE:?verified write egress image is required}
    networks: [write-egress-internal, outbound]
    restart: unless-stopped
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 32
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /var/cache/squid:size=4m,mode=1777
      - /var/log/squid:size=2m,mode=1777
      - /var/run/squid:size=1m,mode=1777
    logging:
      driver: json-file
      options: {max-size: 1m, max-file: "2"}
    healthcheck:
      test:
        - CMD-SHELL
        - "printf 'GET http://healthcheck.invalid/ HTTP/1.0\r\n\r\n' | nc -w 3 127.0.0.1 3130 | head -1 | grep -q '403 Forbidden'"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 10s

networks:
  position-internal:
    name: mcp-ozon-position-internal
    external: true
  ozon-egress-internal:
    name: mcp-ozon-egress-internal
    external: true
  write-egress-internal:
    internal: true
  outbound:
    name: mcp-ozon-outbound
    external: true
