services:
  control:
    environment:
      CONTROL_MCP_AUTH_MODE: jwt
      CONTROL_MCP_JWT_ISSUER: ${CONTROL_MCP_JWT_ISSUER:?CONTROL_MCP_JWT_ISSUER is required}
      CONTROL_MCP_JWT_JWKS_URL: http://control-auth-egress:8080/jwks
      CONTROL_MCP_PUBLIC_URL: ${CONTROL_MCP_PUBLIC_URL:?CONTROL_MCP_PUBLIC_URL is required}
      CONTROL_MCP_JWT_AUDIENCE: ${CONTROL_MCP_PUBLIC_URL:?CONTROL_MCP_PUBLIC_URL is required}
      CONTROL_MCP_MARKETPLACE_WRITES_ENABLED: "false"
      CONTROL_MCP_OZON_ACCOUNT_ID: furnitura_dlya_doma
      CONTROL_MCP_OZON_PLANNER_DATABASE_URL: postgresql://ozon_control_planner:${OZON_CONTROL_PLANNER_DB_PASSWORD:?OZON_CONTROL_PLANNER_DB_PASSWORD is required}@position-db:5432/${POSITION_DB_NAME:-ozon_positions}
    networks:
      - position-internal
      - control-auth-egress-internal
    depends_on:
      control-auth-egress:
        condition: service_healthy

  control-auth-egress:
    image: ${MCP_CONTROL_AUTH_EGRESS_IMAGE:-mcp-ozon-control-auth-egress:local}
    build:
      context: .
      dockerfile: Dockerfile.control-auth-egress
      args:
        MCP_RELEASE_GIT_SHA: ${MCP_RELEASE_GIT_SHA:-unverified}
    environment:
      CONTROL_AUTH_JWKS_HOST: ${CONTROL_MCP_JWT_JWKS_HOST:?CONTROL_MCP_JWT_JWKS_HOST is required}
      CONTROL_AUTH_JWKS_PATH: ${CONTROL_MCP_JWT_JWKS_PATH:?CONTROL_MCP_JWT_JWKS_PATH is required}
    networks:
      - control-auth-egress-internal
      - outbound
    restart: unless-stopped
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 32
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs:
      - /tmp:size=8m,mode=1777
    healthcheck:
      test: ["CMD", "wget", "-q", "-T", "3", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 10s

networks:
  position-internal:
    name: mcp-ozon-position-internal
    external: true
  control-auth-egress-internal:
    internal: true
  outbound:
    name: mcp-ozon-outbound
    external: true
