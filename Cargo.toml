[package]
name = "mcp-ozon"
version = "0.2.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
http-body = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
jsonwebtoken = "11.0"
reqwest = { version = "0.13", default-features = false, features = [
    "brotli",
    "gzip",
    "http2",
    "json",
    "query",
    "rustls",
] }
rmcp = { version = "=3.1.1", features = ["transport-io", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
base64 = "0.22"
flate2 = "1"
tower = { version = "0.5", features = ["util"] }

[patch.crates-io]
rmcp = { path = "vendor/rmcp" }
