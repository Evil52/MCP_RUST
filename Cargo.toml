[package]
name = "mcp-ozon"
version = "0.2.0"
edition = "2024"
rust-version = "1.98.0"
publish = false
default-run = "mcp-ozon"

[[bin]]
name = "mcp-ozon"
path = "src/main.rs"
test = false

[[bin]]
name = "mcp-ozon-control"
path = "src/bin/mcp-ozon-control.rs"
test = false

[[bin]]
name = "position-collector"
path = "src/bin/position-collector.rs"
test = false

[[bin]]
name = "report-worker"
path = "src/bin/report-worker.rs"
test = false

[[bin]]
name = "report-collector"
path = "src/bin/report-collector.rs"
test = false

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(coverage)'] }

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
http-body = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["service", "tokio"] }
jsonwebtoken = { version = "11.0", features = ["aws_lc_rs"] }
reqwest = { version = "0.13", default-features = false, features = [
    "brotli",
    "form",
    "gzip",
    "http2",
    "json",
    "query",
    "rustls",
] }
rmcp = { version = "=3.1.1", features = ["transport-io", "transport-streamable-http-server"] }
rust_xlsxwriter = { version = "0.98.2", default-features = false }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "test-util", "time"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
flate2 = "1"
tower = { version = "0.5", features = ["util"] }

[patch.crates-io]
rmcp = { path = "vendor/rmcp" }
