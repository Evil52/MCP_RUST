name: mcp-ozon-wb-automation

services:
  write-egress:
    container_name: mcp-ozon-wb-automation-write-egress
    image: mcp-ozon-wb-automation-write-egress:local
    build:
      context: .
      dockerfile: Dockerfile.control-write-egress
    ports:
      - "127.0.0.1:3130:3130"
    networks:
      - outbound
    restart: unless-stopped
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 32
    stop_grace_period: 10s
    logging:
      driver: json-file
      options:
        max-size: 1m
        max-file: "2"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /var/cache/squid:size=4m,mode=1777
      - /var/log/squid:size=2m,mode=1777
      - /var/run/squid:size=1m,mode=1777
    healthcheck:
      test:
        - CMD-SHELL
        - "printf 'GET http://healthcheck.invalid/ HTTP/1.0\r\n\r\n' | nc -w 3 127.0.0.1 3130 | head -1 | grep -q '403 Forbidden'"
      interval: 30s
      timeout: 8s
      retries: 3
      start_period: 10s

networks:
  outbound:
    name: mcp-ozon-outbound
    external: true
